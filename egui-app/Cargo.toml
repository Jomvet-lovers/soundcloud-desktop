[package]
name = "scd-egui"
version = "0.1.0"
edition = "2024"

# Phase 0: egui 移行の雛形クレート。Tauri / Node に依存しない。
# バックエンド移植 (Phase 1) までは UI シェルと AppState 骨格のみ。

[dependencies]
eframe = "0.36"
egui = "0.36"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "process", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = "0.25"
# --- Phase 1: ported backend (versions match desktop/src-tauri/Cargo.toml) ---
warp = "0.3"
# wreq 5.x は全て yank 済みのため src-tauri/Cargo.lock と同一の 5.3.0 を vendor 化。
# (crates.io 解決不可 → registry キャッシュから vendor/wreq-5.3.0 に展開して patch)
wreq = { version = "5", features = ["json", "stream", "gzip", "brotli", "socks"] }
futures-util = "0.3"
http = "1"
urlencoding = "2"
bytes = "1"
url = "2"
sc-fingerprint = { git = "https://github.com/zxcloli666/SoundCloud-Backend", tag = "v8.5.8" }
# src-tauri は default-features=false だが、他依存の feature unification で
# unicode が有効化されていた。単独では \s が実行時失敗するため既定に戻す。
regex = "1"
decrypt-client = { path = "../utils/decrypt-client" }
rodio = { version = "0.22.2", features = ["mp3", "symphonia-aac", "symphonia-isomp4", "symphonia-ogg"] }
cpal = "0.17"
biquad = "0.5"
rustfft = { version = "6", default-features = false }
ogg = "0.9.2"
audiopus = "0.2.0"
souvlaki = "0.8"
raw-window-handle = "0.6"
ffmpeg-sidecar = "2.5.2"
discord-rich-presence = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["clock"] }
tracing = "0.1"
if-addrs = "0.15"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
wreq = { path = "vendor/wreq-5.3.0" }
wreq-util = { path = "vendor/wreq-util-2.2.6" }
