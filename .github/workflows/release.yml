name: Release

# Windows NSIS installer + Linux deb/rpm/AppImage builds published as GitHub
# Releases.
# - workflow_dispatch: build from any ref and create the release for the given
#   tag (the tag is created at the dispatched commit). `platform` can limit the
#   run to one OS — useful to add assets to an existing release.
# - tag push (v*-direct*): build both platforms and release the pushed tag.
#
# Fork tags use the `v` prefix + `-direct.N` suffix to stay clear of the
# upstream tags (bare numbers such as `8.4.13`).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v8.4.13-direct.1)'
        required: true
        type: string
      platform:
        description: 'Platform to build'
        required: false
        type: choice
        options: [all, windows, linux]
        default: all
  push:
    tags:
      - 'v*-direct*'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows NSIS
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: release-windows

      # BoringSSL (sc-fingerprint) assembles with NASM on Windows; CMake and
      # LLVM (libclang for bindgen) ship with the runner image.
      - name: Install build tools
        run: choco install nasm -y --no-progress

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Collect release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PREV=$(gh release list --limit 5 --json tagName --jq --arg t "$TAG" '[.[].tagName] | map(select(. != $t)) | .[0] // empty')
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          NOTES=$(git log "$RANGE" --format='- %s' -- desktop/ .github/workflows | head -60)
          [ -z "$NOTES" ] && NOTES="- (no app changes)"
          {
            echo "RELEASE_NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCD_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          projectPath: desktop
          args: --bundles nsis
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            **SCD-Direct** — unofficial SoundCloud desktop client (direct mode, works without the vendor backend).

            Windows: NSIS installer plus a portable exe. Needs the WebView2 runtime (ships with current Windows 10/11).

            For features, limitations and sign-in, see the README. Based on [zxcloli666/SoundCloud-Desktop](https://github.com/zxcloli666/SoundCloud-Desktop) (MIT).

            **SCD-Direct** — 非公式 SoundCloud デスクトップクライアント（direct モード、開発元バックエンド不要）。

            Windows 版: NSIS インストーラー＋ポータブル版同梱。WebView2 ランタイムが必要です（現行 Windows 10/11 には標準搭載）。

            機能・制限事項・サインイン方法は README を参照。Based on [zxcloli666/SoundCloud-Desktop](https://github.com/zxcloli666/SoundCloud-Desktop) (MIT).

            ## What's changed
            ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false

      # Portable build — the raw exe (needs the system WebView2 runtime, which
      # ships with current Windows 10/11).
      - name: Attach portable exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $portable = "soundcloud-desktop_${version}_x64_portable.exe"
          Copy-Item desktop/src-tauri/target/release/soundcloud-desktop.exe $portable
          gh release upload $env:TAG $portable --clobber

  linux:
    name: Linux (deb / rpm / AppImage)
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: release-linux

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Collect release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PREV=$(gh release list --limit 5 --json tagName --jq --arg t "$TAG" '[.[].tagName] | map(select(. != $t)) | .[0] // empty')
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          NOTES=$(git log "$RANGE" --format='- %s' -- desktop/ .github/workflows | head -60)
          [ -z "$NOTES" ] && NOTES="- (no app changes)"
          {
            echo "RELEASE_NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCD_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          projectPath: desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            **SCD-Direct** — unofficial SoundCloud desktop client (direct mode, works without the vendor backend).

            Linux: deb / rpm / AppImage packages.

            For features, limitations and sign-in, see the README. Based on [zxcloli666/SoundCloud-Desktop](https://github.com/zxcloli666/SoundCloud-Desktop) (MIT).

            **SCD-Direct** — 非公式 SoundCloud デスクトップクライアント（direct モード、開発元バックエンド不要）。

            Linux 版: deb / rpm / AppImage を同梱。

            機能・制限事項・サインイン方法は README を参照。Based on [zxcloli666/SoundCloud-Desktop](https://github.com/zxcloli666/SoundCloud-Desktop) (MIT).

            ## What's changed
            ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false
