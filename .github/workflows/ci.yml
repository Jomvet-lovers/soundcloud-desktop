name: CI

on:
  push:
    branches: [direct-mode, egui-migration/**]
  pull_request:
    branches: [direct-mode, egui-migration/**]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc + biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: desktop
        run: npx tsc --noEmit

      - name: Biome check
        working-directory: desktop
        run: npx biome check src

  rust:
    name: Rust (cargo check + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev cmake clang libclang-dev pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Cargo check
        working-directory: desktop/src-tauri
        run: cargo check

      - name: Cargo tests
        working-directory: desktop/src-tauri
        run: cargo test

  egui:
    name: egui-app (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev pkg-config cmake perl libclang-dev libopus-dev libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: egui-app -> target

      - name: Cargo check (egui-app)
        working-directory: egui-app
        run: cargo check --all-targets

      - name: Cargo tests (egui-app)
        working-directory: egui-app
        run: cargo test
