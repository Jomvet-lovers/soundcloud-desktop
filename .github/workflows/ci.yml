name: CI

on:
  push:
    branches: [direct-mode]
  pull_request:
    branches: [direct-mode]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc + biome + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: desktop
        run: npx tsc --noEmit

      - name: Biome check
        working-directory: desktop
        run: npx biome check src

      # The bundle is what ships; a Tailwind/rollup-only breakage would
      # otherwise surface for the first time in the release job.
      - name: Production build
        working-directory: desktop
        run: pnpm build

  rust:
    name: Rust (check + clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev cmake clang libclang-dev pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked

      # Correctness lints only: the tree still carries pre-existing style and
      # dead-code warnings, so `-D warnings` would never be green.
      - name: Cargo clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D clippy::correctness

      - name: Cargo tests
        working-directory: desktop/src-tauri
        run: cargo test --locked
