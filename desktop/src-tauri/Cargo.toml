[package]
name = "soundcloud-desktop"
version = "8.4.18"
description = "Beautiful Soundcloud Desktop app"
authors = ["zxcloli666"]
edition = "2024"

[lib]
name = "soundcloud_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Pin to the feat/cef branch version — otherwise cargo picks a newer crates.io release (without the cef feature).
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = ["macos-private-api", "devtools", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "process"] }
warp = "0.3"
discord-rich-presence = "1"
tauri-plugin-http = "2.5.7"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
sc-fingerprint = { git = "https://github.com/zxcloli666/SoundCloud-Backend", tag = "v8.5.8" }
wreq = { version = "5", features = ["json", "stream", "gzip", "brotli", "socks"] }
futures-util = "0.3"
http = "1"
urlencoding = "2"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-window-state = "2.4.0"
rodio = { version = "0.22.2", features = ["mp3", "symphonia-aac", "symphonia-isomp4", "symphonia-ogg"] }
cpal = "0.17"
biquad = "0.5"
rustfft = { version = "6", default-features = false }
souvlaki = "0.8"
raw-window-handle = "0.6"
tauri-plugin-dialog = "2.7.0"
ogg = "0.9.2"
audiopus = "0.2.0"
chrono = { version = "0.4", features = ["clock"] }
libc = "0.2"
url = "2"
regex = { version = "1", default-features = false, features = ["std"] }
bytes = "1"
decrypt-client = { path = "../../utils/decrypt-client" }
tracing = "0.1"
ffmpeg-sidecar = "2.5.2"
if-addrs = "0.15"
uuid = { version = "1", features = ["v4"] }

[features]
# Opt-in: render through CEF (Chromium) instead of wry/webkitgtk. Requires [patch.crates-io] below.
# The default build (without this feature) stays on wry.
cef = ["tauri/cef"]

[profile.release]
# thin LTO: nearly fat-LTO runtime quality with a much faster build.
lto = "thin"

# Experimental Tauri branch with the tauri-runtime-cef runtime and the `cef` feature.
# Patch ONLY `tauri` (a single crate for the whole graph → crates.io plugins share
# the same runtime) and `tauri-build` (our build-dep, pinned to the branch version). Internal
# tauri-* (tauri-runtime/utils/macros/codegen/plugin) are pulled in by git-tauri itself via path;
# we do NOT patch them separately — otherwise crates.io plugin build scripts hit a schemars
# version skew (tauri-plugin::global_scope_schema).
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", branch = "feat/cef" }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.5", default-features = false, features = ["tokio"] }
